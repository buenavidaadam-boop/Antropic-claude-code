<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Game Stash Arcade</title>
  <meta name="description" content="500+ free browser games — 3D racing, survival, arcade, puzzle and more." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="top">
    <a class="logo" href="#" data-home>🎮 <span>Game Stash</span> Arcade</a>
    <input id="q" type="search" placeholder="Search games…" autocomplete="off" aria-label="Search games" />
    <button class="btn" id="random" title="Play a random game">🎲 Random</button>
  </header>

  <main id="home">
    <section class="hero">
      <div>
        <h1><span id="count">500+</span> games. No downloads.</h1>
        <p>3D racing, survival shooters, arcade classics, puzzles and more — all playable right in your browser. Your best scores are saved on this device.</p>
      </div>
      <div class="hero-cards" id="featured"></div>
    </section>

    <nav class="chips" id="chips" aria-label="Categories"></nav>
    <div class="filters">
      <label>Difficulty
        <select id="diff"><option value="">Any</option><option value="1">Easy</option><option value="2">Normal</option><option value="3">Hard</option></select>
      </label>
      <label>Theme <select id="theme"><option value="">Any</option></select></label>
      <label>Sort
        <select id="sort"><option value="">Featured</option><option value="az">A–Z</option><option value="best">My best scores</option></select>
      </label>
      <span class="results" id="results"></span>
    </div>
    <section class="grid" id="grid"></section>
    <p class="empty hidden" id="empty">No games match. Try another search.</p>
  </main>

  <section id="player" class="player hidden" aria-label="Game player">
    <div class="pbar">
      <button class="btn" id="back">← Back</button>
      <div class="ptitle"><strong id="ptitle"></strong><span id="pmeta"></span></div>
      <button class="btn" id="fav" title="Favourite">☆</button>
      <button class="btn" id="restart">↻ Restart</button>
      <button class="btn" id="full">⛶</button>
    </div>
    <div class="pwrap" id="pwrap"></div>
    <p class="pcontrols" id="pcontrols"></p>
  </section>

  <footer class="foot">All games are original and built for this site. P / Esc pauses.</footer>

  <script src="js/core.js"></script>
  <script src="js/engines/three.js"></script>
  <script src="js/engines/arcade.js"></script>
  <script src="js/engines/puzzle.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
